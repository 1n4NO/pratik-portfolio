<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PolInsight pixel print texture</title>
  <desc id="desc">A pixel-grid field with blue, yellow, and navy blocks that breaks upward into a bright white lower field.</desc>
  <defs>
    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff" stop-opacity="0.92"/>
      <stop offset="0.35" stop-color="#e8f0ff" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#d8e5ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d8e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="blueCells" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#eff3ff" />
      <rect x="1" y="1" width="7" height="7" fill="#526dff" />
      <rect x="10" y="2" width="5" height="5" fill="#9eb3ff" />
      <rect x="4" y="10" width="4" height="4" fill="#24356f" />
    </pattern>
    <pattern id="blueCellsAlt" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="translate(9 6)">
      <rect width="18" height="18" fill="#f6f8ff" />
      <rect x="0" y="0" width="6" height="6" fill="#3552ff" />
      <rect x="8" y="3" width="6" height="6" fill="#7b95ff" />
      <rect x="5" y="10" width="5" height="5" fill="#1f2d5e" />
    </pattern>
    <pattern id="yellowCells" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#fff8dc" />
      <rect x="1" y="1" width="7" height="7" fill="#ffd63a" />
      <rect x="10" y="2" width="5" height="5" fill="#ffbf24" />
      <rect x="4" y="10" width="4" height="4" fill="#ffec8f" />
    </pattern>
    <pattern id="yellowCellsAlt" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="translate(7 8)">
      <rect width="18" height="18" fill="#fff9e3" />
      <rect x="0" y="0" width="6" height="6" fill="#ffd024" />
      <rect x="9" y="2" width="6" height="6" fill="#ffe66d" />
      <rect x="5" y="9" width="5" height="5" fill="#f7b900" />
    </pattern>
    <pattern id="inkCells" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#e9eefc" />
      <rect x="1" y="1" width="7" height="7" fill="#2d3557" />
      <rect x="10" y="2" width="5" height="5" fill="#141b36" />
      <rect x="4" y="10" width="4" height="4" fill="#59627f" />
    </pattern>
    <clipPath id="upperField">
      <path d="M0 0H1600V0H1600V244C1530 212 1474 227 1410 261C1338 300 1266 289 1192 242C1120 196 1040 185 946 219C858 251 780 260 706 231C624 198 542 192 460 220C384 246 312 253 242 237C166 219 94 193 0 202Z" />
    </clipPath>
    <clipPath id="blueBand">
      <path d="M0 0H1600V286C1524 264 1450 279 1378 318C1302 360 1230 363 1162 331C1086 295 1008 286 926 311C838 338 754 356 672 343C590 330 500 290 404 269C320 250 224 255 116 288C72 302 36 313 0 310Z" />
    </clipPath>
    <clipPath id="yellowField">
      <path d="M880 0H1600V0H1600V318C1538 291 1478 286 1416 305C1348 326 1282 357 1214 352C1144 346 1090 312 1042 286C988 256 928 244 880 254Z" />
    </clipPath>
    <clipPath id="inkField">
      <path d="M0 0H590V0H590V214C526 240 468 252 414 244C356 235 302 215 244 197C176 175 112 178 44 214C20 227 8 234 0 240Z" />
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#ffffff" />

  <g clip-path="url(#upperField)" opacity="0.98">
    <rect width="1600" height="420" fill="url(#blueCells)" />
    <rect width="1600" height="420" fill="url(#blueCellsAlt)" opacity="0.88" />
  </g>

  <g clip-path="url(#blueBand)" opacity="0.78">
    <rect width="1600" height="370" fill="url(#blueCells)" />
