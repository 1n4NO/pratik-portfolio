<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Marbled print texture</title>
  <desc id="desc">A blue and orange marbled print with fluid veining and paper tone.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8dccb"/>
      <stop offset="1" stop-color="#d7c2aa"/>
    </linearGradient>
    <linearGradient id="blueFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a9ac0"/>
      <stop offset="0.5" stop-color="#196f93"/>
      <stop offset="1" stop-color="#0f4d69"/>
    </linearGradient>
    <linearGradient id="orangeFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a2b"/>
      <stop offset="0.5" stop-color="#f36a08"/>
      <stop offset="1" stop-color="#d45100"/>
    </linearGradient>
    <linearGradient id="creamVein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f0e5d6"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#paper)" />

