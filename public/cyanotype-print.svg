<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cyanotype print texture</title>
  <desc id="desc">A soft paper cyanotype print with uneven chemical washes and blueprint linework.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1ebdf"/>
      <stop offset="0.58" stop-color="#e1d7c8"/>
      <stop offset="1" stop-color="#d5c8b7"/>
    </linearGradient>
    <linearGradient id="blueDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d92d4"/>
      <stop offset="0.55" stop-color="#1f6da6"/>
      <stop offset="1" stop-color="#0c3f73"/>
    </linearGradient>
    <linearGradient id="blueWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58ade0"/>
      <stop offset="1" stop-color="#185f91"/>
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <filter id="blurMid" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="blurEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)" />

